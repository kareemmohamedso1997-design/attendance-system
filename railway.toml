[build]
  builder      = "NIXPACKS"
  buildCommand = "npm install --omit=dev"

[deploy]
  startCommand            = "node server.js"
  healthcheckPath         = "/api/health"
  healthcheckTimeout      = 30
  restartPolicyType       = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[environment]
  NODE_ENV = "production"
