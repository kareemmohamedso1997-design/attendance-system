# Netlify configuration for the attendance-system frontend.
# This file lives inside the "client" folder that you deploy to Netlify.

[build]
  publish = "."

# ── Pretty-URL rewrites ───────────────────────────────────────────────────────
[[redirects]]
  from   = "/login"
  to     = "/login.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# ── API Proxy ────────────────────────────────────────────────────────────────
# Forwards every /api/* call to the Railway backend so the browser never
# makes a cross-origin request and CORS is never an issue.
#
# STEP: replace RAILWAY_BACKEND_URL below with your Railway domain BEFORE
# deploying to Netlify.  Example:
#   https://attendance-system-production.up.railway.app

[[redirects]]
  from  = "/api/*"
  to    = "RAILWAY_BACKEND_URL/api/:splat"
  status = 200
  force  = true
