<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Secure employee attendance tracking system">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2316a34a' width='192' height='192'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='80' font-weight='bold' fill='white' font-family='Arial'>A</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2316a34a' width='100' height='100'/><text x='50' y='55' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <title>Login - Attendance System</title>
  <link rel="stylesheet" href="css/login-style.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>🔐 Attendance System</h1>
        <p>Secure Login</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username or email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="form-group remember">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="login-btn">
          <span id="loginText">Login</span>
          <span id="loadingSpinner" style="display: none;">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle>
            </svg>
          </span>
        </button>
      </form>

      <div id="messageAlert" class="message-alert" style="display: none;"></div>

      <div class="login-footer">
        <p>Demo Credentials:</p>
        <p class="demo-creds">
          <strong>Username:</strong> john.doe<br>
          <strong>Password:</strong> Password123
        </p>
      </div>
    </div>

    <div class="features-box">
      <h2>Features</h2>
      <ul>
        <li>✓ Secure JWT Authentication</li>
        <li>✓ GPS Location Tracking</li>
        <li>✓ Advanced Reporting</li>
        <li>✓ Role-Based Access</li>
        <li>✓ Real-time Statistics</li>
      </ul>
    </div>
  </div>

  <script src="js/login.js"></script>
  <script src="js/pwa-manager.js"></script>
</body>
</html>
