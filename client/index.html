<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Employee attendance tracking and check-in/out">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2316a34a' width='192' height='192'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='80' font-weight='bold' fill='white' font-family='Arial'>A</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2316a34a' width='100' height='100'/><text x='50' y='55' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <title>Employee Dashboard – Attendance System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">📋 Attendance System</h1>
      <div class="nav-user-info">
        <span class="nav-welcome">Welcome, <strong id="userName">...</strong></span>
        <button id="logoutBtn" class="btn-nav-logout">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Check-out confirm modal -->
  <div id="confirmModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Confirm Check-Out</h3>
      <p id="confirmMessage">Are you sure you want to check out?</p>
      <div class="modal-actions">
        <button id="confirmNo"  class="btn btn-secondary">Cancel</button>
        <button id="confirmYes" class="btn btn-danger">Check Out</button>
      </div>
    </div>
  </div>

  <div class="container">

    <!-- Welcome / live clock -->
    <div class="welcome-card">
      <div class="welcome-text">
        <h2>👋 Good <span id="greeting">day</span>, <span id="welcomeName">...</span></h2>
        <p id="welcomeDate">Loading...</p>
      </div>
      <div class="welcome-time">
        <div id="liveClock" class="live-clock">--:--:--</div>
        <div id="liveDate" class="live-date"></div>
      </div>
    </div>

    <!-- Check In / Check Out -->
    <div class="card">
      <h2>📍 Your Attendance</h2>

      <div id="gpsStatus" class="gps-status gps-idle">
        <span class="gps-dot"></span>
        <span id="gpsStatusText">Location not captured yet</span>
        <button id="refreshLocationBtn" class="btn-gps-refresh" title="Refresh location">↻</button>
      </div>

      <div class="button-group">
        <button id="checkinBtn"  class="btn btn-primary">✓ Check In</button>
        <button id="checkoutBtn" class="btn btn-danger">⊗ Check Out</button>
      </div>
    </div>

    <!-- Current Status -->
    <div class="card">
      <h2>📊 Current Status</h2>
      <div id="statusContainer" class="status-container">
        <div class="empty-state">
          <div class="empty-state-icon">⏳</div>
          <p>Loading status…</p>
        </div>
      </div>
    </div>

    <!-- Today's Attendance -->
    <div class="card">
      <h2>📅 Today's Attendance</h2>
      <div class="table-responsive">
        <table class="table" id="todayAttendanceTable">
          <thead>
            <tr>
              <th>Check In</th>
              <th>Check Out</th>
              <th>Duration</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <div class="empty-state-icon">📋</div>
                  <p>No records yet today.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/main.js"></script>
  <script src="js/pwa-manager.js"></script>
</body>
</html>
